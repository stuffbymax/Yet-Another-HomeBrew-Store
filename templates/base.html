<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title or "Homebrew Store" }}</title>
  <style>
    body{font:16px system-ui;margin:0;background:#111827;color:#f9fafb}main,header{max-width:1000px;margin:auto;padding:1rem}
    a{color:#93c5fd}.nav{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
    .card,form{background:#1f2937;padding:1rem;border-radius:8px;margin:1rem 0}input,textarea,select{display:block;width:100%;box-sizing:border-box;margin:.35rem 0 1rem;padding:.6rem}
    button{padding:.6rem 1rem;cursor:pointer}.error{background:#7f1d1d;padding:.7rem}.tag{color:#a7f3d0}
  </style>
</head>
<body><header class="nav"><a href="{{ url_for('index') }}"><strong>Homebrew Store</strong></a>
  <nav>{% if current_user.is_authenticated %}<a href="{{ url_for('create_app_route') }}">Publish</a> <form style="display:inline;background:none;padding:0" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Log out</button></form>
  {% else %}<a href="{{ url_for('login') }}">Log in</a> <a href="{{ url_for('register') }}">Register</a>{% endif %}</nav></header>
  <main>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="{{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
</body></html>
