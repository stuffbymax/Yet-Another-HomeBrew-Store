{% extends "base.html" %}
{% block title %}Audit log · YAHBS{% endblock %}
{% block content %}
<h1>Audit log</h1>
<table><thead><tr><th>When (UTC)</th><th>Who</th><th>Action</th><th>Target</th></tr></thead><tbody>
{% for r in rows %}<tr><td>{{ r.at.strftime('%Y-%m-%d %H:%M') }}</td><td>{{ r.actor }}</td><td>{{ r.action }}</td><td>{{ r.target }}</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
